<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Mycel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="brand" data-page="home" aria-label="Mycel Übersicht">
          <span>Mycel</span>
        </button>
        <nav class="primary-nav" aria-label="Hauptnavigation">
          <button data-page="home"><span>⌂</span> Übersicht</button>
          <button data-page="chapters"><span>▤</span> Kapitel</button>
          <button data-page="characters"><span>♧</span> Figuren</button>
          <button data-page="places"><span>⌖</span> Orte</button>
          <button data-page="knowledge"><span>◇</span> Wissen</button>
          <button data-page="writing"><span>✎</span> Schreiben</button>
          <button data-page="progress"><span>⌁</span> Fortschritt</button>
        </nav>
        <div class="top-actions">
          <button
            id="project-search-open"
            class="icon-button search-open"
            title="Im Projekt suchen"
            aria-label="Im Projekt suchen"
          >⌕</button>
          <span id="project-pill" class="project-pill"
            >Kein Projekt geöffnet</span
          ><button
            id="open-project"
            class="icon-button"
            title="Projektordner öffnen"
            aria-label="Projektordner öffnen"
          >
            ↗</button
          ><button id="new-project" class="avatar-button" title="Neues Projekt">
            ＋
          </button>
        </div>
      </header>

      <main id="page" class="page"></main>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <dialog id="dialog" class="dialog"></dialog>
      <dialog id="search-dialog" class="dialog project-search-dialog">
        <div class="project-search-panel">
          <label class="project-search-input-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="project-search-input" type="search" placeholder="Im gesamten Projekt suchen …" autocomplete="off" />
            <kbd>Esc</kbd>
          </label>
          <div id="project-search-results" class="project-search-results"></div>
          <div class="project-search-help">Kapitel, Figuren, Orte und Wissen</div>
        </div>
      </dialog>
    </div>
    <div id="character-tooltip" class="character-tooltip" hidden></div>
    <script src="renderer.js"></script>
  </body>
</html>
